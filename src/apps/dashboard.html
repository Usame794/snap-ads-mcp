<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Account dashboard</title>
<style>
:root{--fb-bg:#fff;--fb-bg2:#f4f5f7;--fb-text:#14171c;--fb-muted:#5b6270;--fb-border:#d9dce2;--fb-good:#1a8a5a;--fb-bad:#c92a2a;--fb-warn:#9a5b00;--accent:#3b5bdb}
@media (prefers-color-scheme:dark){:root{--fb-bg:#1b1d22;--fb-bg2:#252830;--fb-text:#eceef2;--fb-muted:#9aa1ad;--fb-border:#3a3e48;--fb-good:#4cd38e;--fb-bad:#ff7b7b;--fb-warn:#ffc15a;--accent:#8aa0ff}}
:root[data-theme=light]{--fb-bg:#fff;--fb-bg2:#f4f5f7;--fb-text:#14171c;--fb-muted:#5b6270;--fb-border:#d9dce2;--fb-good:#1a8a5a;--fb-bad:#c92a2a;--fb-warn:#9a5b00;--accent:#3b5bdb}
:root[data-theme=dark]{--fb-bg:#1b1d22;--fb-bg2:#252830;--fb-text:#eceef2;--fb-muted:#9aa1ad;--fb-border:#3a3e48;--fb-good:#4cd38e;--fb-bad:#ff7b7b;--fb-warn:#ffc15a;--accent:#8aa0ff}
:root{--bg:var(--color-background-primary,var(--fb-bg));--bg2:var(--color-background-secondary,var(--fb-bg2));--text:var(--color-text-primary,var(--fb-text));--muted:var(--color-text-secondary,var(--fb-muted));--border:var(--color-border-primary,var(--fb-border));--good:var(--color-text-success,var(--fb-good));--bad:var(--color-text-danger,var(--fb-bad));--warn:var(--color-text-warning,var(--fb-warn))}
*{box-sizing:border-box}
body{margin:0;padding:16px;background:var(--bg);color:var(--text);font:14px/1.45 var(--font-sans,system-ui,-apple-system,"Segoe UI",sans-serif)}
h1{font-size:18px;margin:0}h2{font-size:14px;margin:0 0 8px;color:var(--muted);font-weight:600}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.sub{color:var(--muted);font-size:12px}
.seg{display:flex;border:1px solid var(--border);border-radius:10px;overflow:hidden}
.seg button{min-height:44px;min-width:56px;padding:0 14px;border:0;background:var(--bg);color:var(--text);font:inherit;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button[aria-pressed=true]{background:var(--accent);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:14px}
.tile,.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:12px}
.tile .label{color:var(--muted);font-size:12px}.tile .value{font-size:22px;font-weight:650;margin-top:2px}
.card{margin-bottom:12px}
.bar{fill:var(--accent)}.axis{fill:var(--muted);font-size:10px}
.track{height:12px;border-radius:6px;background:var(--border);overflow:hidden;position:relative}
.fill{height:100%;background:var(--accent)}
.legend{display:flex;flex-wrap:wrap;gap:12px;color:var(--muted);font-size:12px;margin-top:6px}
.warn{color:var(--warn);font-size:12px;margin:8px 0 0}
.skeleton{background:linear-gradient(90deg,var(--bg2),var(--border),var(--bg2));background-size:200% 100%;animation:sk 1.2s linear infinite;border-radius:8px;min-height:64px}
@keyframes sk{to{background-position:-200% 0}}
.err{color:var(--bad)}
.alert{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--warn);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.alert.critical{border-color:var(--bad)}
.alert .x{min-height:44px;min-width:44px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}
@media (prefers-reduced-motion:reduce){.skeleton{animation:none}}
</style>
</head>
<body>
<main>
  <header>
    <div><h1>Account dashboard</h1><div class="sub" id="sub">Loading...</div></div>
    <div class="seg" role="group" aria-label="Period" id="seg"></div>
  </header>
  <section id="alerts" aria-live="polite"></section>
  <section class="tiles" id="kpis" aria-live="polite"><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div></section>
  <section class="card"><h2>Spend by day</h2><div id="chart"><div class="skeleton"></div></div></section>
  <section class="card" id="pacing" hidden><h2>This month</h2><div id="pacingBody"></div></section>
  <p class="warn" id="warn" hidden></p>
</main>
<!--BRIDGE-->
<script>
(function () {
  const { el, num } = window.snapApp;
  const state = { days: 7, busy: false };
  const $ = (id) => document.getElementById(id);

  function buttons() {
    const seg = $("seg");
    seg.textContent = "";
    for (const d of [7, 14, 30]) {
      seg.append(el("button", { type: "button", "aria-pressed": String(state.days === d), onclick: () => load(d) }, d + " days"));
    }
  }

  function tile(label, value, tone) {
    const v = el("div", { class: "value" }, value);
    if (tone) v.style.color = "var(--" + tone + ")";
    return el("div", { class: "tile" }, el("div", { class: "label" }, label), v);
  }

  function chart(daily) {
    const box = $("chart");
    box.textContent = "";
    if (!daily || !daily.length) { box.append(el("div", { class: "sub" }, "No daily data for this period.")); return; }
    const W = 600, H = 150, padL = 4, padB = 18;
    const max = Math.max.apply(null, daily.map((d) => d.spend)) || 1;
    const bw = (W - padL) / daily.length;
    const ns = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(ns, "svg");
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);
    svg.setAttribute("role", "img");
    svg.setAttribute("aria-label", "Bar chart of daily spend");
    svg.style.width = "100%";
    svg.style.height = "auto";
    daily.forEach((d, i) => {
      const h = Math.max(1, ((H - padB) * d.spend) / max);
      const r = document.createElementNS(ns, "rect");
      r.setAttribute("class", "bar");
      r.setAttribute("x", String(padL + i * bw + bw * 0.12));
      r.setAttribute("y", String(H - padB - h));
      r.setAttribute("width", String(bw * 0.76));
      r.setAttribute("height", String(h));
      r.setAttribute("rx", "2");
      const t = document.createElementNS(ns, "title");
      t.textContent = d.date + ": spend " + num(d.spend) + ", purchases " + num(d.purchases, 0) + ", ROAS " + num(d.roas);
      r.append(t);
      svg.append(r);
    });
    [0, daily.length - 1].forEach((i, k) => {
      const tx = document.createElementNS(ns, "text");
      tx.setAttribute("class", "axis");
      tx.setAttribute("x", String(k === 0 ? padL : W));
      tx.setAttribute("y", String(H - 4));
      tx.setAttribute("text-anchor", k === 0 ? "start" : "end");
      tx.textContent = daily[i].date;
      svg.append(tx);
    });
    box.append(svg, el("div", { class: "legend" }, el("span", null, "Highest day: " + num(max)), el("span", null, "Hover or tap a bar for the day's numbers")));
  }

  function pacing(p, cur) {
    const sec = $("pacing"), body = $("pacingBody");
    body.textContent = "";
    if (!p) { sec.hidden = true; return; }
    sec.hidden = false;
    const top = Math.max(p.most_it_could_spend_this_month, p.projected_month_spend, p.month_to_date_spend) || 1;
    const bar = (label, value, tone) => {
      const f = el("div", { class: "fill" });
      f.style.width = Math.min(100, (value / top) * 100) + "%";
      if (tone) f.style.background = "var(--" + tone + ")";
      return el("div", { style: "margin-bottom:10px" }, el("div", { class: "sub" }, label + ": " + num(value) + cur), el("div", { class: "track" }, f));
    };
    body.append(
      bar("Spent so far", p.month_to_date_spend),
      bar("Projected for the month", p.projected_month_spend, "warn"),
      bar("Most it could spend (every active ad squad at full budget)", p.most_it_could_spend_this_month, "bad"),
      el("div", { class: "sub" }, "Today: " + num(p.spend_today) + cur + " across " + num(p.active_squads, 0) + " active ad squads, daily budgets total " + num(p.active_daily_budgets_total) + cur)
    );
  }

  const dismissed = {};
  const ALERT_TITLE = { SPEND_SPIKE: "Spend jumped", SPEND_DROP: "Spend dropped", TRACKING_SILENT: "No purchases for two days", NO_PURCHASES: "No purchases yesterday", PURCHASES_DROP: "Purchases fell", ROAS_DROP: "ROAS fell", CPA_SPIKE: "Cost per purchase jumped" };
  function alerts(list) {
    const box = $("alerts");
    box.textContent = "";
    for (const a of (list || []).filter((x) => !dismissed[x.code])) {
      const strong = el("div", { style: "font-weight:650" }, ALERT_TITLE[a.code] || a.code);
      strong.style.color = a.severity === "CRITICAL" ? "var(--bad)" : "var(--warn)";
      box.append(el("div", { class: "alert" + (a.severity === "CRITICAL" ? " critical" : "") },
        el("div", { style: "flex:1;min-width:0" }, strong, el("div", { class: "sub" }, (a.day ? a.day + ": " : "") + a.detail)),
        el("button", { type: "button", class: "x", "aria-label": "Dismiss alert", onclick: () => { dismissed[a.code] = true; alerts(list); window.snapApp.resize(); } }, "×")));
    }
  }

  function render(data) {
    if (!data || !data.totals) { $("sub").textContent = "No data."; return; }
    alerts(data.alerts);
    const cur = data.account && data.account.currency ? " " + data.account.currency : "";
    state.days = data.range.days;
    buttons();
    $("sub").textContent = "Account " + data.account.id + " | last " + data.range.days + " days, ending today 00:00 (UTC" + data.range.utc_offset + ")";
    const t = data.totals;
    const k = $("kpis");
    k.textContent = "";
    k.append(tile("Spend" + cur, num(t.spend)), tile("ROAS", num(t.roas), t.roas === null ? "" : t.roas >= 1 ? "good" : "bad"), tile("Purchases", num(t.purchases, 0)), tile("Cost per purchase" + cur, num(t.cpa)), tile("Swipe rate", t.swipe_rate_pct === null ? "n/a" : num(t.swipe_rate_pct) + "%"));
    chart(data.daily);
    pacing(data.pacing, cur);
    const w = $("warn");
    w.hidden = !(data.warnings && data.warnings.length);
    w.textContent = (data.warnings || []).join(" ");
    window.snapApp.resize();
  }

  async function load(days) {
    if (state.busy) return;
    state.busy = true;
    state.days = days;
    buttons();
    try {
      const r = await window.snapApp.call("snap_dashboard", { days });
      if (r.isError) { $("sub").textContent = window.snapApp.textOf(r); $("sub").className = "sub err"; }
      else { $("sub").className = "sub"; render(window.snapApp.dataOf(r)); }
    } catch (e) {
      $("sub").textContent = "Could not load: " + e.message;
      $("sub").className = "sub err";
    } finally {
      state.busy = false;
    }
  }

  buttons();
  window.snapApp.connect({
    "ui/notifications/tool-result": (r) => { if (r && !r.isError) render(window.snapApp.dataOf(r)); else if (r) { $("sub").textContent = window.snapApp.textOf(r); $("sub").className = "sub err"; } },
    error: (e) => { $("sub").textContent = "Not connected to the chat app: " + e.message; },
  });
})();
</script>
</body>
</html>
